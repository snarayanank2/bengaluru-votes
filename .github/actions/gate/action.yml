name: gate
description: >
  The checks every change must pass before it can merge or deploy: typecheck,
  Kannada translation staleness (with the one accepted exception), a production
  build, the Vitest suite, and the Playwright smoke suite. Budget: the whole
  job stays under 2 minutes (the only build is the e2e one; the Chromium download is cached). The calling job supplies the Postgres service
  (composite actions cannot declare one) and DATABASE_URL / SITE_ORIGIN.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
    - name: Install
      shell: bash
      run: npm ci
    - name: Translation staleness
      shell: bash
      run: npx tsx scripts/ci/translate-gate.ts
    - name: Typecheck
      shell: bash
      run: npm run typecheck
    - name: Unit and route tests
      shell: bash
      run: npm test
    - name: Playwright version
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache the Chromium download
      id: pwcache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
    - name: Install the browser for the smoke suite
      shell: bash
      run: |
        if [ "${{ steps.pwcache.outputs.cache-hit }}" = true ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi
    - name: Create the e2e database
      shell: bash
      run: psql "$DATABASE_URL" -c 'CREATE DATABASE bv_e2e'
    - name: Build, seed and run the smoke suite
      shell: bash
      run: |
        export DATABASE_URL="${DATABASE_URL%/bv_test}/bv_e2e"
        npm run build:e2e
        npm run seed:e2e
        npm run test:e2e
