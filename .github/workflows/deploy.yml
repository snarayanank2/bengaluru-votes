name: deploy

# Production deploys (architecture §14.4, revised 2026-11-04).
#
#   decide  -> was this exact tree already tested by a PR run?   (no secrets)
#   test    -> if not, run the gate                               (no secrets)
#   deploy  -> tag, install env from GitHub, deploy.sh, auto-rollback
#
# A failed run emails whoever triggered it (GitHub Actions notifications, set to
# "failed workflows only"); there is no separate alert mailer.
#
# Every push to main (a PR merge or a direct commit) deploys. workflow_dispatch
# is kept for redeploy, deploy-tag and rollback.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: deploy-head
        options:
          - deploy-head       # tag and deploy the commit this run was started on
          - redeploy-current  # reinstall env and redeploy the tag production runs now
          - deploy-tag        # deploy an existing tag (give it below)
          - rollback          # retag :previous and restart
      tag:
        description: Existing tag for deploy-tag, e.g. v2026.11.04
        type: string
        required: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A push that changed nothing the image or the box runs (docs, tests, CI
      # config) neither tests nor deploys. Manual runs always deploy.
      - name: Did this push change anything production runs?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/ci/changed-paths.mjs "$BEFORE" HEAD
          else
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.runtime == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.changes.outputs.runtime == 'true'
      - name: Was this exact tree already tested?
        id: check
        if: steps.changes.outputs.runtime == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action || 'deploy-head' }}
        run: |
          if [ "$EVENT" = push ] || [ "$ACTION" = deploy-head ]; then
            npx tsx scripts/ci/tested-tree.ts
          else
            # redeploy / deploy-tag / rollback ship something that already passed.
            echo "tested=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: decide
    if: needs.decide.outputs.runtime == 'true' && needs.decide.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bv_test
      SITE_ORIGIN: https://bengaluruvotes.opencity.in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate

  deploy:
    needs: [decide, test]
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.runtime == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      ACTION: ${{ inputs.action || 'deploy-head' }}
      INPUT_TAG: ${{ inputs.tag }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The default token is used only to push the release tag.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: this job holds the root SSH key, so no dependency
      # install script may run in it.
      - run: npm ci --ignore-scripts

      - name: Render the env file (fails before touching the box if anything is missing)
        id: render
        if: env.ACTION != 'rollback'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          umask 077
          npx tsx scripts/ci/env-render.ts render > "$RUNNER_TEMP/env.production"
          echo "rendered $(wc -l < "$RUNNER_TEMP/env.production" | tr -d ' ') keys"

      - name: Configure SSH (pinned host key)
        id: ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/ci_deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User root"
            echo "  IdentityFile ~/.ssh/ci_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > ~/.ssh/config

      # A push that is no longer main's head is skipped: a newer push is (or will
      # be) deploying a tree that includes it. This stops a slow, fully tested
      # older commit from overwriting a newer fast one.
      - name: Is this still the head of main?
        id: fresh
        if: env.ACTION != 'rollback' && github.event_name == 'push'
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "main has moved on ($SHA is not the head); a newer deploy covers it."
            echo "STALE=true" >> "$GITHUB_ENV"
          fi

      - name: Refuse to delete box keys the manifest lacks
        if: env.ACTION != 'rollback' && env.STALE != 'true'
        run: |
          umask 077
          ssh vps 'cat /etc/bengaluru-votes/.env.production' > "$RUNNER_TEMP/box.env"
          npx tsx scripts/ci/env-render.ts orphans --box "$RUNNER_TEMP/box.env"
          rm -f "$RUNNER_TEMP/box.env"

      - name: Decide the tag
        id: tag
        if: env.ACTION != 'rollback' && env.STALE != 'true'
        run: |
          set -euo pipefail
          case "$ACTION" in
            deploy-head)
              npx tsx scripts/ci/tag.ts "$SHA"
              ;;
            deploy-tag)
              [[ "$INPUT_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "tag input must look like v2026.11.04" >&2; exit 1; }
              git rev-parse --verify --quiet "refs/tags/$INPUT_TAG" >/dev/null || { echo "no such tag: $INPUT_TAG" >&2; exit 1; }
              # Tests are skipped for an existing tag, so it must point into main's history.
              git merge-base --is-ancestor "$INPUT_TAG^{commit}" origin/main || { echo "$INPUT_TAG is not in main's history" >&2; exit 1; }
              echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
              echo "create=false" >> "$GITHUB_OUTPUT"
              ;;
            redeploy-current)
              cur=$(ssh vps 'cd /root/src/bengaluru-votes-production && git describe --tags --exact-match')
              [[ "$cur" =~ ^v[0-9.]+$ ]] || { echo "production is not on a release tag" >&2; exit 1; }
              echo "tag=$cur" >> "$GITHUB_OUTPUT"
              echo "create=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Create and push the release tag
        if: steps.tag.outputs.create == 'true' && env.STALE != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$TAG" -m "release $TAG ($RUN_URL)" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Install the env file
        id: install
        if: env.ACTION != 'rollback' && env.STALE != 'true'
        run: deploy/install-env.sh < "$RUNNER_TEMP/env.production"

      - name: Deploy
        id: ship
        if: env.STALE != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set +e
          if [ "$ACTION" = rollback ]; then
            deploy/deploy.sh production --rollback
          else
            deploy/deploy.sh production "$TAG"
          fi
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      # deploy.sh exits 3 once the stack has restarted (the old version is gone),
      # 1 before that. Either way the previous env file goes back so the box
      # matches what is actually running; only exit 3 needs the image rolled back.
      - name: Restore the previous env and roll back
        id: recover
        if: (failure() || cancelled()) && (steps.ship.outcome == 'failure' || steps.ship.outcome == 'cancelled')
        env:
          SHIP_RC: ${{ steps.ship.outputs.rc }}
        run: |
          set +e
          if [ "$ACTION" != rollback ]; then
            ssh vps 'f=/etc/bengaluru-votes/.env.production; [ -f $f.prev ] && cp -p $f.prev $f'
          fi
          # A cancelled or timed-out deploy leaves no exit code: assume the worst.
          [ -z "$SHIP_RC" ] && SHIP_RC=3
          if [ "$SHIP_RC" = 3 ] && [ "$ACTION" != rollback ]; then
            if deploy/deploy.sh production --rollback; then
              echo "kind=rolled-back" >> "$GITHUB_OUTPUT"
            else
              echo "kind=rollback-failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
