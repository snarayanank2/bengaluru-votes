# Local development stack — `docker compose -f deploy/compose.local.yml up`.
#
# NOT a deployment. compose.production.yml / compose.staging.yml also build
# the Dockerfile now (architecture §14.3), but they front it with a TLS
# nginx, run certbot and the jobs container, and expect real vendor
# credentials. This file exposes the Astro server directly on
# http://localhost:4321 with none of that — no nginx, no certbot, no jobs
# container (its cron entries need restic + off-box storage + healthchecks.io
# credentials no laptop has, and the local database is disposable demo data).
#
# Secrets here are deliberately fixed, weak and committed: this stack binds
# to localhost only and holds nothing real. Never reuse these values anywhere
# that is reachable from the internet.
#
#   docker compose -f deploy/compose.local.yml up --build -d   # start
#   docker compose -f deploy/compose.local.yml logs -f app     # tail
#   docker compose -f deploy/compose.local.yml down            # stop
#   docker compose -f deploy/compose.local.yml down -v         # stop + wipe DB
#
# Migrations run automatically (the `migrate` service). Seeding does not — a
# fresh database renders every page with a healthy 200 and no wards on it.
# After the first `up`, once:
#
#   C="docker compose -f deploy/compose.local.yml run --rm --no-deps"
#   $C app npm run seed:wards                      # the real 369 GBA wards
#   $C -e NODE_ENV=development app npm run seed:dev  # fictional demo content
#
# `seed:dev` needs that NODE_ENV override because it refuses to run under
# NODE_ENV=production (its own guard — it writes fake candidates), and this
# stack deliberately runs as production; see the `app` service below. The
# override is safe HERE and nowhere else.
#
# Read the database directly with:
#   psql postgres://gba:gba_local_dev@localhost:5433/gba
#
# THE ORIGIN ARGS ARE LOAD-BEARING. astro.config.mjs resolves `site` and
# `security.allowedDomains` once, at BUILD time, against two hard-coded
# *.opencity.in hostnames. An image built without SITE_ORIGIN/
# EXTRA_ALLOWED_ORIGIN serves every GET on localhost with a healthy 200 and
# 403s every POST — ward lookup, login, votes and flags all break, and
# nothing in `ps`, the healthcheck or the logs says so (see the deploy-vps
# skill, "The one thing that breaks silently"). They are wired below, so the
# only way to hit this is to change PORT without rebuilding: after changing
# it, re-run with `--build`.

name: bengaluru-votes-local

services:
  # Same Dockerfile the deployed images are built from, using its development
  # target. The repository is mounted below, so Astro's dev server watches the
  # host working tree and reloads source changes without rebuilding the image.
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
      args:
        SITE_ORIGIN: http://localhost:${PORT:-4321}
        EXTRA_ALLOWED_ORIGIN: http://localhost:${PORT:-4321}
    image: bengaluru-votes:local
    # Gitignored local credentials; never commit this file.
    env_file:
      - ./.env.local
    # 127.0.0.1 only — never 0.0.0.0. This stack has weak fixed credentials
    # and no TLS; it must not be reachable from the local network.
    ports:
      - '127.0.0.1:${PORT:-4321}:4321'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://gba:gba_local_dev@postgres:5432/gba
      SITE_ORIGIN: http://localhost:${PORT:-4321}
      # Fixed, public, local-only. Rotating it just logs out your local
      # sessions. `openssl rand -hex 32` for anything that isn't this.
      SESSION_SECRET: local_dev_only_not_a_secret_0000000000000000000000000000000000
      # No vendor keys are set below, so nothing can reach a real person
      # even by accident. This is the same explicit guard staging carries.
      SENDS_DISABLED: 'true'
      # Writes each generated OTP in plaintext to `otp_test_codes` so you can
      # read it back over the psql URL in this file's header. NOTE:
      # src/lib/otp.ts only reaches this write *after* a successful send, and
      # with SENDS_DISABLED there is no send — so local login still fails at
      # `send_failed`. Set here for the e2e path and for the day a sandbox
      # SendGrid key gets added; it is not a working local login on its own.
      OTP_TEST_SINK: 'true'
      RETENTION_ENABLED: 'false'
      # Explicitly scoped to a loopback SITE_ORIGIN by recaptcha.ts; lets the
      # production-mode local container exercise anonymous forms without a key.
      ALLOW_INSECURE_LOCAL_RECAPTCHA: 'true'
      # SENDGRID_*, TWILIO_*, ANTHROPIC_API_KEY, SENTRY_DSN and
      # GA_MEASUREMENT_ID remain deliberately unset. Each degrades to a
      # documented no-op (runbook.md).
    volumes:
      # Mount the working tree for hot reload. Keep image-installed
      # node_modules visible inside the container rather than shadowing them
      # with the host's dependencies.
      - ..:/app
      - /app/node_modules
      # The browser fetches this static boundary data from /data/ while the
      # development server is running.
      - ../data:/app/public/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4321/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot, forward-only. Runs to completion before `app` starts, so a
  # plain `up` on a fresh volume yields a migrated database instead of an
  # app container restart-looping against empty tables.
  # Deliberately `image:` + `pull_policy: never` rather than repeating `app`'s
  # build block. Two services declaring a build for the SAME tag makes
  # Compose run both builds concurrently and both export to
  # `bengaluru-votes:local`, and the loser dies with `image ... already
  # exists` (hit while writing this file). Compose finishes the whole build
  # phase before it creates any container, so `app`'s build has already
  # produced the tag by the time this service starts; `pull_policy: never`
  # stops Compose reaching for a registry copy that has never existed.
  migrate:
    image: bengaluru-votes:local
    pull_policy: never
    command: ['npm', 'run', 'migrate']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gba:gba_local_dev@postgres:5432/gba
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gba
      POSTGRES_PASSWORD: gba_local_dev
      POSTGRES_DB: gba
    # Exposed for psql/GUI access from the host. 127.0.0.1 only, and on 5433
    # so it never collides with a Postgres already running on the default
    # 5432. Containers still reach it as `postgres:5432` on the internal
    # network — DATABASE_URL above uses that, not this.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gba -d gba']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data_local:
