# Rate-limit zones (Task 60, architecture.md §7). `limit_req_zone` only
# DEFINES a zone — it does not itself limit anything; each zone is applied
# with `limit_req zone=<name> burst=<n> [nodelay];` in the location blocks
# that need it (conf.d/site.conf). 10m per zone (~160k tracked IPs each) is
# the same sizing for all of them; the request RATE differs to match how
# aggressive each surface's own legitimate traffic looks.
#
# api: general JSON/API traffic (issue votes, flags, ward lookup, etc.) — a
# coarse backstop sized for CGNAT (many citizens sharing one carrier IP),
# not a precise per-user cap; per-user/per-action limits, where they exist,
# live in application code (e.g. the flag allowances in src/lib/flag-abuse.ts), not here.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Anonymous issue ballots: the empty key means GET status/result reads use
# only the general API limit, while PUT ballots also get this slower limit.
map $request_method $vote_limit_key {
  default "";
  PUT $binary_remote_addr;
}
limit_req_zone $vote_limit_key zone=vote:10m rate=10r/m;

# /login form posts: 5 per minute per client. Keyed on POST only (same
# pattern as $vote_limit_key above) so loading the page is never limited.
# Guards the staff sign-in (src/lib/staff-login.ts) against password guessing.
map $request_method $login_limit_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=login:10m rate=5r/m;

# Public report submission and receipt initialization share a network budget.
limit_req_zone $binary_remote_addr zone=flags:10m rate=10r/m;
